# SonarQube Cloud (sonarcloud.io) analysis, run by .github/workflows/pr-check.yml once the
# SONAR_TOKEN secret is set. The organization and key must match the project on sonarcloud.io.

sonar.organization=flyingriverhorse
sonar.projectKey=flyingriverhorse_Koloni
sonar.projectName=KOLONİ

sonar.sources=app,frontend/src
sonar.tests=tests
# The tests run in CI and their coverage is imported; the test code itself is not analysed.
sonar.test.exclusions=**/*

sonar.sourceEncoding=UTF-8
sonar.python.version=3.12

sonar.exclusions=\
  references/**,\
  runtime/**,\
  docs/**,\
  alembic/versions/**,\
  **/node_modules/**,\
  **/.venv/**,\
  **/__pycache__/**,\
  frontend/dist/**,\
  frontend/e2e/**,\
  frontend/src/**/*.test.*,\
  frontend/src/test-fixtures.ts,\
  frontend/src/test-setup.ts,\
  frontend/src/api/generated.ts

# Cobertura XML combined from backend.yml's six pytest parts by pr-check.yml's sonar job.
# The frontend has no coverage report yet (vitest's coverage package is not installed).
sonar.python.coverage.reportPaths=coverage-backend.xml
