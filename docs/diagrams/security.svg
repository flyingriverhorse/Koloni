<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1220px" height="1140px" viewBox="0 0 1220 1140"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="backdrop"><g><rect x="10" y="10" width="1200" height="1120" fill="#ffffff" stroke="none" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/></g></g><g data-cell-id="title"><g><rect x="40" y="26" width="1140" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="24px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="42" y="56">Security boundaries: what stands between agents and the rest</text></g></g></g><g data-cell-id="machine"><g transform="translate(0.5,0.5)"><rect x="30" y="72" width="860" height="976" rx="17.2" ry="17.2" fill="#fcfcfc" stroke="#666666" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="17px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="44" y="101">Your machine</text></g></g></g><g data-cell-id="page"><g transform="translate(0.5,0.5)"><rect x="50" y="114" width="330" height="90" rx="9" ry="9" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="215" y="147.5">Your browser: the KOLONİ page</text><text x="215" y="165.5">holds the page key (from the link</text><text x="215" y="183.5">KOLONİ prints, or a one-time code)</text></g></g></g><g data-cell-id="koloni"><g transform="translate(0.5,0.5)"><rect x="440" y="110" width="430" height="140" rx="14" ry="14" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="655" y="141.5">KOLONİ on 127.0.0.1 only</text><text x="655" y="159.5">every /api call needs the page key</text><text x="655" y="177.5">(X-KOLONI-Key); answering a card, and the</text><text x="655" y="195.5">settings that guard agents, also</text><text x="655" y="213.5">need the page's own Origin; no</text><text x="655" y="231.5">other page may frame it</text></g></g></g><g data-cell-id="e5"><g><path d="M 380 159 L 430.88 153.06" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 438.33 152.19 L 431.32 156.79 L 430.45 149.34 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="own"><g transform="translate(0.5,0.5)"><rect x="50" y="240" width="330" height="110" rx="11" ry="11" fill="#f8cecc" stroke="#b85450" pointer-events="all" style="fill: light-dark(rgb(248, 206, 204), rgb(81, 45, 43)); stroke: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="215" y="274.5">KOLONİ's own folder and runtime/</text><text x="215" y="292.5">code, database (keys in plain text),</text><text x="215" y="310.5">logs: never opened by an agent,</text><text x="215" y="328.5">even inside a project you open</text></g></g></g><g data-cell-id="agents"><g transform="translate(0.5,0.5)"><rect x="50" y="390" width="820" height="632" rx="12.64" ry="12.64" fill="#fcfcfc" stroke="#6c8ebf" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="64" y="418">What agents reach</text></g></g></g><g data-cell-id="proj"><g transform="translate(0.5,0.5)"><rect x="66" y="430" width="380" height="126" rx="12.6" ry="12.6" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="256" y="463.5">Your project folder</text><text x="256" y="481.5">read and search freely; changes as</text><text x="256" y="499.5">your level says; a secret file only on</text><text x="256" y="517.5">Allow once; files that steer later</text><text x="256" y="535.5">turns ask at every level</text></g></g></g><g data-cell-id="copies"><g transform="translate(0.5,0.5)"><rect x="466" y="430" width="388" height="126" rx="12.6" ry="12.6" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="660" y="472.5">Working copies</text><text x="660" y="490.5">sub-agents and away jobs work</text><text x="660" y="508.5">here, outside your folder, until</text><text x="660" y="526.5">you take their work in</text></g></g></g><g data-cell-id="cmd"><g transform="translate(0.5,0.5)"><rect x="66" y="572" width="380" height="140" rx="14" ry="14" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="256" y="603.5">Commands</text><text x="256" y="621.5">no page key and no secret-named</text><text x="256" y="639.5">variables unless you pass them; keys</text><text x="256" y="657.5">in output shown as ***; Docker (if</text><text x="256" y="675.5">you pick it): a fresh container, only</text><text x="256" y="693.5">the folder, network off</text></g></g></g><g data-cell-id="cli"><g transform="translate(0.5,0.5)"><rect x="466" y="572" width="388" height="140" rx="14" ry="14" fill="#e1d5e7" stroke="#9673a6" pointer-events="all" style="fill: light-dark(rgb(225, 213, 231), rgb(57, 47, 63)); stroke: light-dark(rgb(150, 115, 166), rgb(149, 119, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="660" y="594.5">What a CLI sees</text><text x="660" y="612.5">KOLONİ's tools: only those, over MCP.</text><text x="660" y="630.5">Native: its own tools, most asking</text><text x="660" y="648.5">KOLONİ first (not Codex's safe commands</text><text x="660" y="666.5">and web search, nor agy's reads in</text><text x="660" y="684.5">Reads mode: see Known limits), and</text><text x="660" y="702.5">the raw output before KOLONİ masks it</text></g></g></g><g data-cell-id="secrets"><g transform="translate(0.5,0.5)"><rect x="66" y="728" width="380" height="160" rx="16" ry="16" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="256" y="751.5">Secrets you give</text><text x="256" y="769.5">an agent asks for a key by name: a</text><text x="256" y="787.5">hidden card, Give / Reject; its value</text><text x="256" y="805.5">goes only into that turn's commands'</text><text x="256" y="823.5">environment, shown as *** in their</text><text x="256" y="841.5">output; never the chat, the record or</text><text x="256" y="859.5">the model; a branch holding it is</text><text x="256" y="877.5">never merged or kept</text></g></g></g><g data-cell-id="outside"><g transform="translate(0.5,0.5)"><rect x="466" y="728" width="388" height="160" rx="16" ry="16" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="660" y="760.5">Outside content</text><text x="660" y="778.5">web pages, search, MCP results,</text><text x="660" y="796.5">Knowledge, a GitHub issue's text: framed</text><text x="660" y="814.5">as data, not instructions (KOLONİ's own</text><text x="660" y="832.5">tools; not a CLI's own); a forged end</text><text x="660" y="850.5">marker is defused. Limit: look-alike</text><text x="660" y="868.5">letters</text></g></g></g><g data-cell-id="blocked"><g transform="translate(0.5,0.5)"><rect x="66" y="904" width="788" height="56" rx="5.6" ry="5.6" fill="#f8cecc" stroke="#b85450" pointer-events="all" style="fill: light-dark(rgb(248, 206, 204), rgb(81, 45, 43)); stroke: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="460" y="929.5">Always blocked: your home folder, a drive's root, where</text><text x="460" y="947.5">secrets are kept, KOLONİ itself, the system's folders</text></g></g></g><g data-cell-id="canary"><g transform="translate(0.5,0.5)"><rect x="66" y="968" width="788" height="44" rx="4.4" ry="4.4" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="460" y="987.5">Planted test key (canary): a command, request, browser or MCP call</text><text x="460" y="1004.5">that would send it out is refused, and the work stops</text></g></g></g><g data-cell-id="e14"><g><path d="M 556.76 390 L 556.14 259.18" fill="none" stroke="#b85450" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"/><path d="M 556.11 251.68 L 559.89 259.16 L 552.39 259.19 Z" fill="#b85450" stroke="#b85450" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(184, 84, 80), rgb(215, 129, 126)); stroke: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"/></g><g><g fill="#b85450" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"><rect fill="#ffffff" stroke="none" x="471" y="303" width="171" height="37" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="556.43" y="317.5">an agent's call to the API:</text><text x="556.43" y="335.5">no key, refused</text></g></g></g><g data-cell-id="out"><g transform="translate(0.5,0.5)"><rect x="910" y="72" width="280" height="560" rx="5.6" ry="5.6" fill="#fcfcfc" stroke="#d79b00" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="924" y="100">Leaves the machine only when</text><text x="924" y="119">you set it up or allow it</text></g></g></g><g data-cell-id="o1"><g transform="translate(0.5,0.5)"><rect x="926" y="140" width="248" height="56" rx="5.6" ry="5.6" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1050" y="165.5">Model providers: your</text><text x="1050" y="183.5">messages and the work</text></g></g></g><g data-cell-id="o2"><g transform="translate(0.5,0.5)"><rect x="926" y="206" width="248" height="56" rx="5.6" ry="5.6" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1050" y="231.5">Search by meaning, to the</text><text x="1050" y="249.5">provider you picked</text></g></g></g><g data-cell-id="o3"><g transform="translate(0.5,0.5)"><rect x="926" y="272" width="248" height="56" rx="5.6" ry="5.6" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1050" y="297.5">Web searches and requests,</text><text x="1050" y="315.5">public addresses only</text></g></g></g><g data-cell-id="o4"><g transform="translate(0.5,0.5)"><rect x="926" y="338" width="248" height="56" rx="5.6" ry="5.6" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1050" y="363.5">Notifications, catalogue,</text><text x="1050" y="381.5">skills, MCP package checks</text></g></g></g><g data-cell-id="o5"><g transform="translate(0.5,0.5)"><rect x="926" y="404" width="248" height="56" rx="5.6" ry="5.6" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1050" y="429.5">Pull requests, plan checks,</text><text x="1050" y="447.5">Knowledge's pages</text></g></g></g><g data-cell-id="o6"><g transform="translate(0.5,0.5)"><rect x="926" y="470" width="248" height="76" rx="7.6" ry="7.6" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1050" y="496.5">What MCP servers and</text><text x="1050" y="514.5">commands reach: they run</text><text x="1050" y="532.5">with your own rights</text></g></g></g><g data-cell-id="never"><g transform="translate(0.5,0.5)"><rect x="910" y="660" width="280" height="70" rx="7" ry="7" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1050" y="692.5">Never: telemetry (none is sent),</text><text x="1050" y="710.5">the page key to an agent</text></g></g></g><g data-cell-id="limit"><g transform="translate(0.5,0.5)"><rect x="910" y="746" width="280" height="86" rx="8.6" ry="8.6" fill="#f8cecc" stroke="#b85450" pointer-events="all" style="fill: light-dark(rgb(248, 206, 204), rgb(81, 45, 43)); stroke: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1050" y="778">Where it ends: Full auto's harm</text><text x="1050" y="795">check is a courtesy; a script can</text><text x="1050" y="812">still read .env without Docker</text></g></g></g><g data-cell-id="e40"><g><path d="M 926 300 L 910 300 Q 900 300 900 310 L 900 798 Q 900 808 890 808 L 863.18 808" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 855.68 808 L 863.18 804.25 L 863.18 811.75 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="876" y="556" width="49" height="19" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="900" y="570.5">framed</text></g></g></g><g data-cell-id="footer"><g><rect x="40" y="1060" width="1140" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#555555" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><text x="42" y="1079">From: app/main.py (PageKey, NoFrame), app/api/deps.py (require_own_origin), app/workspace.py (_kept_out), app/commands.py (CANARY),</text><text x="42" y="1095">app/model_cli.py (_inherited), app/mcp_bridge.py, app/raw.py, app/copies.py, app/executors/, app/web.py, app/tools.py,</text><text x="42" y="1111">frontend/src/commands/OutsideApproval.tsx (7 Nov 2026)</text></g></g></g></g></g></g></svg>