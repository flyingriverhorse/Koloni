<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1260px" height="950px" viewBox="0 0 1260 950"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="backdrop"><g><rect x="10" y="10" width="1240" height="930" fill="#ffffff" stroke="none" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/></g></g><g data-cell-id="title"><g><rect x="40" y="26" width="1180" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="24px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="42" y="56">The recipe engine: how a team's recipe runs, loops and ends</text></g></g></g><g data-cell-id="start"><g transform="translate(0.5,0.5)"><rect x="30" y="100" width="170" height="90" rx="9" ry="9" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="115" y="133">Start</text><text x="115" y="152">one working copy</text><text x="115" y="171">for the team</text></g></g></g><g data-cell-id="step"><g transform="translate(0.5,0.5)"><rect x="240" y="80" width="260" height="130" rx="13" ry="13" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="370" y="114">A step</text><text x="370" y="133">Who: a role (at most 1 to 5),</text><text x="370" y="152">the team's experts, the</text><text x="370" y="171">Orchestrator picks, a team's</text><text x="370" y="190">stages, or Candidates</text></g></g></g><g data-cell-id="group"><g transform="translate(0.5,0.5)"><rect x="540" y="70" width="290" height="150" rx="3" ry="3" fill="#fcfcfc" stroke="#6c8ebf" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="554" y="98">All at once</text></g></g></g><g data-cell-id="g1"><g transform="translate(0.5,0.5)"><rect x="555" y="106" width="120" height="46" rx="4.6" ry="4.6" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="615" y="135">a step</text></g></g></g><g data-cell-id="g2"><g transform="translate(0.5,0.5)"><rect x="695" y="106" width="120" height="46" rx="4.6" ry="4.6" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="755" y="135">a step</text></g></g></g><g data-cell-id="gw"><g><rect x="555" y="160" width="270" height="46" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="557" y="180">waits for all branches,</text><text x="557" y="197">or the first one done</text></g></g></g><g data-cell-id="review"><g transform="translate(0.5,0.5)"><rect x="870" y="90" width="180" height="110" rx="11" ry="11" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="960" y="133">A review step</text><text x="960" y="152">Done when: no finding</text><text x="960" y="171">is left (a review)</text></g></g></g><g data-cell-id="fix"><g transform="translate(0.5,0.5)"><rect x="1080" y="90" width="150" height="110" rx="11" ry="11" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1155" y="133.5">Only if the step</text><text x="1155" y="151.5">before found a</text><text x="1155" y="169.5">problem: a fixer</text></g></g></g><g data-cell-id="e10"><g><path d="M 200 145 L 230.82 145" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 238.32 145 L 230.82 148.75 L 230.82 141.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e11"><g><path d="M 500 145 L 530.82 145" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 538.32 145 L 530.82 148.75 L 530.82 141.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e12"><g><path d="M 830 145 L 860.82 145" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 868.32 145 L 860.82 148.75 L 860.82 141.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e13"><g><path d="M 1050 145 L 1070.82 145" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 1078.32 145 L 1070.82 148.75 L 1070.82 141.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e14"><g><path d="M 1155 200 L 1155 250 Q 1155 260 1145 260 L 380 260 Q 370 260 370 250 L 370 219.18" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 370 211.68 L 373.75 219.18 L 366.25 219.18 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="703" y="243" width="129" height="37" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="767" y="257.5">Loop back: at most</text><text x="767" y="275.5">1 to 5 rounds</text></g></g></g><g data-cell-id="find"><g transform="translate(0.5,0.5)"><rect x="30" y="310" width="590" height="210" rx="4.2" ry="4.2" fill="#fcfcfc" stroke="#d79b00" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="44" y="338">Findings in a review's report</text></g></g></g><g data-cell-id="block"><g transform="translate(0.5,0.5)"><rect x="44" y="350" width="280" height="150" rx="15" ry="15" fill="#f8cecc" stroke="#b85450" pointer-events="all" style="fill: light-dark(rgb(248, 206, 204), rgb(81, 45, 43)); stroke: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="184" y="395.5">Blocking (unmarked, security,</text><text x="184" y="413.5">a failing test): the work goes</text><text x="184" y="431.5">back along the loop. No rounds</text><text x="184" y="449.5">left: it stops before the next</text><text x="184" y="467.5">step, findings are left</text></g></g></g><g data-cell-id="sugg"><g transform="translate(0.5,0.5)"><rect x="344" y="350" width="260" height="150" rx="15" ry="15" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="474" y="413.5">A suggestion: no work</text><text x="474" y="431.5">goes back; it is left</text><text x="474" y="449.5">for you on the card</text></g></g></g><g data-cell-id="cand"><g transform="translate(0.5,0.5)"><rect x="640" y="310" width="590" height="210" rx="4.2" ry="4.2" fill="#fcfcfc" stroke="#9673a6" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(150, 115, 166), rgb(149, 119, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="654" y="338">Candidates and Evolve</text></g></g></g><g data-cell-id="c1"><g transform="translate(0.5,0.5)"><rect x="654" y="350" width="270" height="150" rx="15" ry="15" fill="#e1d5e7" stroke="#9673a6" pointer-events="all" style="fill: light-dark(rgb(225, 213, 231), rgb(57, 47, 63)); stroke: light-dark(rgb(150, 115, 166), rgb(149, 119, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="789" y="404.5">2 to 5 candidates, the</text><text x="789" y="422.5">same job, each in its own</text><text x="789" y="440.5">copy; their models: Auto,</text><text x="789" y="458.5">Same model or I pick each</text></g></g></g><g data-cell-id="c2"><g transform="translate(0.5,0.5)"><rect x="940" y="346" width="276" height="158" rx="15.8" ry="15.8" fill="#e1d5e7" stroke="#9673a6" pointer-events="all" style="fill: light-dark(rgb(225, 213, 231), rgb(57, 47, 63)); stroke: light-dark(rgb(150, 115, 166), rgb(149, 119, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1078" y="388.5">The Measure command scores</text><text x="1078" y="405.5">each (0 to 100); a card picks</text><text x="1078" y="422.5">(Full auto: the best). It is kept</text><text x="1078" y="439.5">only if it beats the best kept;</text><text x="1078" y="456.5">below the Target, a loop tries</text><text x="1078" y="473.5">again (Evolve: 3 Coders)</text></g></g></g><g data-cell-id="e21"><g><path d="M 924 425 L 930.82 425" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 938.32 425 L 930.82 428.75 L 930.82 421.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="ask"><g transform="translate(0.5,0.5)"><rect x="30" y="550" width="1200" height="140" rx="2.8" ry="2.8" fill="#fcfcfc" stroke="#666666" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="44" y="578">Asking you on the way</text></g></g></g><g data-cell-id="askme"><g transform="translate(0.5,0.5)"><rect x="44" y="586" width="580" height="90" rx="9" ry="9" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="334" y="619.5">Ask me to approve its work before it goes on: a card with</text><text x="334" y="637.5">Go on, Ask for changes (the same step again, with your</text><text x="334" y="655.5">words) or Stop</text></g></g></g><g data-cell-id="fails"><g transform="translate(0.5,0.5)"><rect x="644" y="586" width="572" height="90" rx="9" ry="9" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="930" y="628.5">If it fails: ask me (Try again, Skip, Stop) or stop.</text><text x="930" y="646.5">A step with nobody to fill it is passed over.</text></g></g></g><g data-cell-id="end"><g transform="translate(0.5,0.5)"><rect x="30" y="720" width="260" height="130" rx="13" ry="13" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="160" y="755.5">An end</text><text x="160" y="773.5">Ask me, then in: the card.</text><text x="160" y="791.5">Tell me what was found:</text><text x="160" y="809.5">the card only if files</text><text x="160" y="827.5">changed or a fixer worked</text></g></g></g><g data-cell-id="fork"><g><rect x="30" y="206" width="200" height="96" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="start" font-size="14px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="32" y="226">A step with more</text><text x="32" y="243">than one arrow out</text><text x="32" y="260">runs every path;</text><text x="32" y="277">where they meet</text><text x="32" y="294">waits for all.</text></g></g></g><g data-cell-id="ready"><g transform="translate(0.5,0.5)"><rect x="340" y="720" width="320" height="130" rx="13" ry="13" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="500" y="763.5">Ready for you</text><text x="500" y="782.5">once every team is at its end:</text><text x="500" y="801.5">Take in / Fix the findings /</text><text x="500" y="820.5">Ask for changes</text></g></g></g><g data-cell-id="back"><g transform="translate(0.5,0.5)"><rect x="710" y="720" width="520" height="130" rx="13" ry="13" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="970" y="755.5">Ask for changes: back to the last loop's</text><text x="970" y="773.5">first step (or the first step), rounds</text><text x="970" y="791.5">count again, your words go to the agents.</text><text x="970" y="809.5">Fix the findings: it takes the work in,</text><text x="970" y="827.5">then a Coder fixes what is left.</text></g></g></g><g data-cell-id="e29"><g><path d="M 290 785 L 330.82 785" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 338.32 785 L 330.82 788.75 L 330.82 781.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e30"><g><path d="M 660 785 L 700.82 785" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 708.32 785 L 700.82 788.75 L 700.82 781.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="auto"><g><rect x="40" y="856" width="1190" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="42" y="877">At Full auto the work is taken in without the card, unless a team failed or a check was skipped.</text></g></g></g><g data-cell-id="footer"><g><rect x="40" y="894" width="1180" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#555555" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><text x="42" y="913">From: app/recipe_run.py, app/recipes.py, app/evolve.py, app/agent/spawn_mixin.py, app/agent/summary.py, app/agent/__init__.py (6 Nov 2026)</text></g></g></g></g></g></g></svg>