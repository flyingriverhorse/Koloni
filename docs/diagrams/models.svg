<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1220px" height="900px" viewBox="0 0 1220 900"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="backdrop"><g><rect x="10" y="10" width="1200" height="880" fill="#ffffff" stroke="none" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/></g></g><g data-cell-id="title"><g><rect x="40" y="26" width="1140" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="24px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="42" y="56">Model and tier choice: where an agent runs</text></g></g></g><g data-cell-id="h1"><g><rect x="40" y="76" width="390" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="17px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="42" y="99">Tried in this order</text></g></g></g><g data-cell-id="s1"><g transform="translate(0.5,0.5)"><rect x="40" y="110" width="390" height="84" rx="8.4" ry="8.4" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="235" y="140">1. Try first: the role's models in</text><text x="235" y="159">your order (at most 5), only where</text><text x="235" y="178">its opener gave the job no tier</text></g></g></g><g data-cell-id="s2"><g transform="translate(0.5,0.5)"><rect x="40" y="244" width="390" height="66" rx="6.6" ry="6.6" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="235" y="274.5">2. The role's own model</text><text x="235" y="293.5">(Who picks it? One model)</text></g></g></g><g data-cell-id="e5"><g><path d="M 235 194 L 235 234.82" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 235 242.32 L 231.25 234.82 L 238.75 234.82 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="164" y="211" width="143" height="19" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="235" y="225.5">none, or passed over</text></g></g></g><g data-cell-id="s3"><g transform="translate(0.5,0.5)"><rect x="40" y="360" width="390" height="84" rx="8.4" ry="8.4" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="235" y="390">3. The first model of the role's tier: One</text><text x="235" y="409">tier, or the Orchestrator's pick in its</text><text x="235" y="428">range; a tier the opener gave wins over 1.</text></g></g></g><g data-cell-id="e7"><g><path d="M 235 310 L 235 350.82" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 235 358.32 L 231.25 350.82 L 238.75 350.82 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="164" y="327" width="143" height="19" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="235" y="341.5">none, or passed over</text></g></g></g><g data-cell-id="s4"><g transform="translate(0.5,0.5)"><rect x="40" y="494" width="390" height="66" rx="6.6" ry="6.6" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="235" y="524.5">4. The chat's model (As the chat;</text><text x="235" y="543.5">Model for this conversation)</text></g></g></g><g data-cell-id="e9"><g><path d="M 235 444 L 235 484.82" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 235 492.32 L 231.25 484.82 L 238.75 484.82 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="164" y="461" width="143" height="19" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="235" y="475.5">none, or passed over</text></g></g></g><g data-cell-id="s5"><g transform="translate(0.5,0.5)"><rect x="40" y="610" width="390" height="66" rx="6.6" ry="6.6" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="235" y="640.5">5. The default provider</text><text x="235" y="659.5">(the first one in the list)</text></g></g></g><g data-cell-id="e11"><g><path d="M 235 560 L 235 600.82" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 235 608.32 L 231.25 600.82 L 238.75 600.82 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="164" y="577" width="143" height="19" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="235" y="591.5">none, or passed over</text></g></g></g><g data-cell-id="lists"><g transform="translate(0.5,0.5)"><rect x="480" y="310" width="300" height="150" rx="15" ry="15" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="630" y="344.5">The tier lists: Strongest,</text><text x="630" y="363.5">Balanced, Fast; models in</text><text x="630" y="382.5">your order. Passed over: off,</text><text x="630" y="401.5">not Agents may use, past its</text><text x="630" y="420.5">limit, or down. A model with</text><text x="630" y="439.5">no tier is only picked by name.</text></g></g></g><g data-cell-id="e13"><g><path d="M 430 402 L 471.31 387.95" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 478.41 385.54 L 472.52 391.5 L 470.1 384.4 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="auto"><g transform="translate(0.5,0.5)"><rect x="480" y="106" width="300" height="150" rx="15" ry="15" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="630" y="140.5">Orchestrator model: automatic</text><text x="630" y="159.5">a fast model judges each</text><text x="630" y="178.5">message easy, normal or hard;</text><text x="630" y="197.5">the Lead runs on a fast,</text><text x="630" y="216.5">balanced or strongest model</text><text x="630" y="235.5">(not in a trigger's turn)</text></g></g></g><g data-cell-id="e15"><g><path d="M 630 256 L 630 300.82" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 630 308.32 L 626.25 300.82 L 633.75 300.82 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="594" y="275" width="74" height="19" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="630" y="289.5">picks a tier</text></g></g></g><g data-cell-id="hardness"><g transform="translate(0.5,0.5)"><rect x="480" y="510" width="300" height="70" rx="7" ry="7" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="630" y="542.5">An agent may call a job easy</text><text x="630" y="560.5">or hard: one tier down or up</text></g></g></g><g data-cell-id="e17"><g><path d="M 630 510 L 630 469.18" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 630 461.68 L 633.75 469.18 L 626.25 469.18 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="lim"><g transform="translate(0.5,0.5)"><rect x="820" y="76" width="370" height="676" rx="7.4" ry="7.4" fill="#fcfcfc" stroke="#d79b00" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="834" y="104">Limits and moves</text></g></g></g><g data-cell-id="plan"><g transform="translate(0.5,0.5)"><rect x="836" y="114" width="338" height="96" rx="9.6" ry="9.6" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1005" y="141.5">A CLI plan: Step down a tier</text><text x="1005" y="159.5">at N % of the plan (a role on</text><text x="1005" y="177.5">one tier or one model is never</text><text x="1005" y="195.5">stepped down)</text></g></g></g><g data-cell-id="money"><g transform="translate(0.5,0.5)"><rect x="836" y="224" width="338" height="116" rx="11.6" ry="11.6" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1005" y="252.5">An API key: at most $ a day or</text><text x="1005" y="270.5">a month. Past it, a new message</text><text x="1005" y="288.5">asks first (Go on anyway / Cancel),</text><text x="1005" y="306.5">a tier pick moves to the next of</text><text x="1005" y="324.5">its tier, no sub-agent opens there</text></g></g></g><g data-cell-id="paid"><g transform="translate(0.5,0.5)"><rect x="836" y="354" width="338" height="116" rx="11.6" ry="11.6" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1005" y="382.5">A sub-agent would move to a</text><text x="1005" y="400.5">provider paid per token while the</text><text x="1005" y="418.5">chat's is not: the Open this</text><text x="1005" y="436.5">sub-agent? card (Open agent /</text><text x="1005" y="454.5">Reject). Nobody watching: not opened</text></g></g></g><g data-cell-id="moved"><g transform="translate(0.5,0.5)"><rect x="836" y="484" width="338" height="116" rx="11.6" ry="11.6" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1005" y="512.5">A sub-agent whose provider fails</text><text x="1005" y="530.5">before its first word (queued too</text><text x="1005" y="548.5">long, server down, a limit) opens</text><text x="1005" y="566.5">once more on the next model of its</text><text x="1005" y="584.5">tier; a move that costs asks first</text></g></g></g><g data-cell-id="qoder"><g transform="translate(0.5,0.5)"><rect x="836" y="614" width="338" height="116" rx="11.6" ry="11.6" fill="#e1d5e7" stroke="#9673a6" pointer-events="all" style="fill: light-dark(rgb(225, 213, 231), rgb(57, 47, 63)); stroke: light-dark(rgb(150, 115, 166), rgb(149, 119, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1005" y="651.5">Qoder's free models queue: shown</text><text x="1005" y="669.5">live; after 90 s queued a sub-agent</text><text x="1005" y="687.5">moves on. An agent that cannot</text><text x="1005" y="705.5">move waits as long as Qoder queues</text></g></g></g><g data-cell-id="e24"><g><path d="M 1005 614 L 1005 609.18" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 1005 601.68 L 1008.75 609.18 L 1001.25 609.18 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="footer"><g><rect x="40" y="824" width="1140" height="60" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#555555" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><text x="42" y="843">From: app/team.py (would_run), app/providers.py (resolved), app/agent/tiers_mixin.py (_by_how_hard), app/agent/spawn_mixin.py (_moved_on),</text><text x="42" y="859">app/model_session.py (QUEUE_WAIT_SECONDS, queued), app/limits.py, app/api/tiers.py,</text><text x="42" y="875">frontend/src/agents/ModelCards.tsx (7 Nov 2026)</text></g></g></g></g></g></g></svg>