<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1260px" height="880px" viewBox="0 0 1260 880"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="backdrop"><g><rect x="10" y="10" width="1240" height="860" fill="#ffffff" stroke="none" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/></g></g><g data-cell-id="title"><g><rect x="40" y="26" width="1180" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="24px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="42" y="56">Install, update and backup: what is where, and what each covers</text></g></g></g><g data-cell-id="checkout"><g transform="translate(0.5,0.5)"><rect x="30" y="76" width="600" height="330" rx="6.6" ry="6.6" fill="#fcfcfc" stroke="#6c8ebf" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="44" y="104">KOLONİ's folder (the git checkout)</text></g></g></g><g data-cell-id="code"><g transform="translate(0.5,0.5)"><rect x="50" y="116" width="270" height="80" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="185" y="153.5">app/, frontend/, scripts/, docs/</text><text x="185" y="171.5">the code, from git</text></g></g></g><g data-cell-id="venv"><g transform="translate(0.5,0.5)"><rect x="340" y="116" width="270" height="80" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="475" y="153.5">.venv</text><text x="475" y="171.5">the Python packages</text></g></g></g><g data-cell-id="dist"><g transform="translate(0.5,0.5)"><rect x="50" y="210" width="270" height="80" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="185" y="247.5">frontend/dist</text><text x="185" y="265.5">the built page</text></g></g></g><g data-cell-id="site"><g transform="translate(0.5,0.5)"><rect x="340" y="210" width="270" height="80" rx="8" ry="8" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="475" y="247.5">runtime/site</text><text x="475" y="265.5">this guide, built</text></g></g></g><g data-cell-id="data"><g transform="translate(0.5,0.5)"><rect x="50" y="304" width="560" height="86" rx="8.6" ry="8.6" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="330" y="335.5">runtime/data/koloni.db: chats, agents, settings, keys</text><text x="330" y="353.5">runtime/data/backups: the last five copies</text><text x="330" y="371.5">runtime/: attachments, skills, logs, cli-homes, copies</text></g></g></g><g data-cell-id="else"><g transform="translate(0.5,0.5)"><rect x="650" y="76" width="580" height="330" rx="6.6" ry="6.6" fill="#fcfcfc" stroke="#666666" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="664" y="104">Elsewhere</text></g></g></g><g data-cell-id="proj"><g transform="translate(0.5,0.5)"><rect x="670" y="116" width="260" height="100" rx="10" ry="10" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="800" y="154.5">Your project folders</text><text x="800" y="172.5">and their .koloni/</text><text x="800" y="190.5">(recipes, knowledge)</text></g></g></g><g data-cell-id="copies"><g transform="translate(0.5,0.5)"><rect x="950" y="110" width="270" height="116" rx="11.6" ry="11.6" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1085" y="140">Working copies, when runtime</text><text x="1085" y="157">sits in a checkout: on Windows</text><text x="1085" y="174">%LOCALAPPDATA%\KOLONI\copies,</text><text x="1085" y="191">else ~/.local/share/KOLONI/copies</text><text x="1085" y="208">($XDG_DATA_HOME if set)</text></g></g></g><g data-cell-id="homes"><g transform="translate(0.5,0.5)"><rect x="670" y="236" width="260" height="110" rx="11" ry="11" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="800" y="270.5">The CLIs' own sign-ins:</text><text x="800" y="288.5">your home folder (My own),</text><text x="800" y="306.5">or runtime/cli-homes</text><text x="800" y="324.5">(Its own for KOLONİ)</text></g></g></g><g data-cell-id="dbase"><g transform="translate(0.5,0.5)"><rect x="950" y="236" width="260" height="110" rx="11" ry="11" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1080" y="270.5">KOLONI_RUNTIME_ROOT</text><text x="1080" y="288.5">moves runtime/ elsewhere;</text><text x="1080" y="306.5">the guide stays in</text><text x="1080" y="324.5">the checkout</text></g></g></g><g data-cell-id="upd"><g transform="translate(0.5,0.5)"><rect x="30" y="430" width="1200" height="200" rx="4" ry="4" fill="#fcfcfc" stroke="#d79b00" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="44" y="458">Update: scripts/update.ps1 or update.sh, with KOLONİ stopped</text></g></g></g><g data-cell-id="u0"><g transform="translate(0.5,0.5)"><rect x="44" y="470" width="158" height="130" rx="13" ry="13" fill="#f8cecc" stroke="#b85450" pointer-events="all" style="fill: light-dark(rgb(248, 206, 204), rgb(81, 45, 43)); stroke: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="123" y="515.5">Refuses: not a git</text><text x="123" y="532.5">checkout, changes in</text><text x="123" y="549.5">KOLONİ's files, or</text><text x="123" y="566.5">something on its port</text></g></g></g><g data-cell-id="u1"><g transform="translate(0.5,0.5)"><rect x="214" y="470" width="158" height="130" rx="13" ry="13" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="293" y="524">1  Backs up the</text><text x="293" y="541">database to</text><text x="293" y="558">runtime/data/backups</text></g></g></g><g data-cell-id="e16"><g><path d="M 202 535 L 204.82 535" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 212.32 535 L 204.82 538.75 L 204.82 531.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="u2"><g transform="translate(0.5,0.5)"><rect x="384" y="470" width="158" height="130" rx="13" ry="13" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="463" y="532.5">2  git pull</text><text x="463" y="549.5">--ff-only</text></g></g></g><g data-cell-id="e18"><g><path d="M 372 535 L 374.82 535" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 382.32 535 L 374.82 538.75 L 374.82 531.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="u3"><g transform="translate(0.5,0.5)"><rect x="554" y="470" width="158" height="130" rx="13" ry="13" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="633" y="524">3  Python packages</text><text x="633" y="541">(uv pip sync, then</text><text x="633" y="558">KOLONİ itself)</text></g></g></g><g data-cell-id="e20"><g><path d="M 542 535 L 544.82 535" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 552.32 535 L 544.82 538.75 L 544.82 531.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="u4"><g transform="translate(0.5,0.5)"><rect x="724" y="470" width="158" height="130" rx="13" ry="13" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="803" y="524">4  The page's</text><text x="803" y="541">packages, then</text><text x="803" y="558">builds the page</text></g></g></g><g data-cell-id="e22"><g><path d="M 712 535 L 714.82 535" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 722.32 535 L 714.82 538.75 L 714.82 531.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="u5"><g transform="translate(0.5,0.5)"><rect x="894" y="470" width="158" height="130" rx="13" ry="13" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="973" y="524">5  Rebuilds this</text><text x="973" y="541">guide, where</text><text x="973" y="558">Zensical is installed</text></g></g></g><g data-cell-id="e24"><g><path d="M 882 535 L 884.82 535" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 892.32 535 L 884.82 538.75 L 884.82 531.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="u6"><g transform="translate(0.5,0.5)"><rect x="1064" y="470" width="158" height="130" rx="13" ry="13" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1143" y="515.5">Restart KOLONİ:</text><text x="1143" y="532.5">the database is</text><text x="1143" y="549.5">migrated as it</text><text x="1143" y="566.5">starts</text></g></g></g><g data-cell-id="e26"><g><path d="M 1052 535 L 1054.82 535" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 1062.32 535 L 1054.82 538.75 L 1054.82 531.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="stops"><g><rect x="40" y="636" width="1190" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="start" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="42" y="657">It stops at the first step that fails: nothing after it runs, except the guide's rebuild, which only warns. -DryRun (or --dry-run) only prints the steps.</text></g></g></g><g data-cell-id="export"><g transform="translate(0.5,0.5)"><rect x="30" y="680" width="590" height="140" rx="14" ry="14" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="325" y="720.5">Export everything (Settings, The app, Your data): one .zip:</text><text x="325" y="738.5">chats, agents, providers, memory, triggers, skills and</text><text x="325" y="756.5">attachments. API keys only with Include API keys and secrets.</text><text x="325" y="774.5">Not in it: project folders, working copies, logs,</text><text x="325" y="792.5">the CLIs' own sign-ins.</text></g></g></g><g data-cell-id="restore"><g transform="translate(0.5,0.5)"><rect x="640" y="680" width="590" height="140" rx="14" ry="14" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="935" y="720.5">Restore from a file: nothing changes until KOLONİ</text><text x="935" y="738.5">starts again; then the file's data comes in and</text><text x="935" y="756.5">yours is set aside in runtime/before-restore.</text><text x="935" y="774.5">Refused while a turn runs or a working copy</text><text x="935" y="792.5">holds changes. Triggers wait for Resume.</text></g></g></g><g data-cell-id="footer"><g><rect x="40" y="824" width="1180" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#555555" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><text x="42" y="843">From: scripts/update.ps1, scripts/update.sh, app/backup.py, app/config.py, app/copies.py, app/limits.py, app/db/session.py, zensical.toml (6 Nov 2026)</text></g></g></g></g></g></g></svg>