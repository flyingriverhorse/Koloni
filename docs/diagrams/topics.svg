<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1220px" height="810px" viewBox="0 0 1220 810"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="backdrop"><g><rect x="10" y="10" width="1200" height="790" fill="#ffffff" stroke="none" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/></g></g><g data-cell-id="title"><g><rect x="40" y="26" width="1140" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="24px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="42" y="56">Who remembers what: a chat's topics, and where the turns before are kept</text></g></g></g><g data-cell-id="s_head"><g><rect x="40" y="76" width="400" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="17px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="42" y="99">One chat, two topics</text></g></g></g><g data-cell-id="cut_label"><g><rect x="476" y="78" width="300" height="22" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#b85450" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="15px" style="fill: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"><text x="478" y="99">New topic: the line between them</text></g></g></g><g data-cell-id="t1"><g transform="translate(0.5,0.5)"><rect x="40" y="110" width="190" height="76" rx="7.6" ry="7.6" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="135" y="145.5">Turn 1: Fix the login bug</text><text x="135" y="163.5">starts topic A</text></g></g></g><g data-cell-id="t2"><g transform="translate(0.5,0.5)"><rect x="250" y="110" width="190" height="76" rx="7.6" ry="7.6" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="345" y="145.5">Turn 2: and the logout</text><text x="345" y="163.5">goes on with topic A</text></g></g></g><g data-cell-id="cut_top"><g><rect x="465" y="104" width="1" height="1" fill="none" stroke="none" pointer-events="all"/></g></g><g data-cell-id="cut_bottom"><g><rect x="465" y="288" width="1" height="1" fill="none" stroke="none" pointer-events="all"/></g></g><g data-cell-id="cut"><g transform="translate(0.5,0.5)"><path d="M 465.5 105 L 465.5 288" fill="none" stroke="#b85450" stroke-width="2.5" stroke-miterlimit="10" stroke-dasharray="7.5 7.5" pointer-events="stroke" style="stroke: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"/></g></g><g data-cell-id="t3"><g transform="translate(0.5,0.5)"><rect x="490" y="110" width="190" height="76" rx="7.6" ry="7.6" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="585" y="145.5">Turn 3: Write the README</text><text x="585" y="163.5">starts topic B</text></g></g></g><g data-cell-id="t4"><g transform="translate(0.5,0.5)"><rect x="700" y="110" width="190" height="76" rx="7.6" ry="7.6" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="795" y="145.5">Turn 4: and add a FAQ</text><text x="795" y="163.5">goes on with topic B</text></g></g></g><g data-cell-id="e1"><g><path d="M 230 148 L 240.82 148" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 248.32 148 L 240.82 151.75 L 240.82 144.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e2"><g><path d="M 680 148 L 690.82 148" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 698.32 148 L 690.82 151.75 L 690.82 144.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="sees"><g transform="translate(0.5,0.5)"><rect x="920" y="110" width="260" height="166" rx="16.6" ry="16.6" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1050" y="154.5">Turn 4's Orchestrator</text><text x="1050" y="172.5">is sent turn 3 and its own</text><text x="1050" y="190.5">message; of topic A, only</text><text x="1050" y="208.5">its name. It can go on with</text><text x="1050" y="226.5">an agent of turn 3 - never</text><text x="1050" y="244.5">one of turn 1 or 2.</text></g></g></g><g data-cell-id="e3"><g><path d="M 890 148 L 911.46 156.44" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 918.44 159.19 L 910.09 159.93 L 912.83 152.95 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="cc_a"><g transform="translate(0.5,0.5)"><rect x="40" y="206" width="400" height="70" rx="7" ry="7" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="240" y="238.5">Claude Code, Native, on its own sign-in:</text><text x="240" y="256.5">turn 2 resumes turn 1's session</text></g></g></g><g data-cell-id="cc_b"><g transform="translate(0.5,0.5)"><rect x="490" y="206" width="400" height="70" rx="7" ry="7" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="690" y="238.5">turn 3 starts a new session;</text><text x="690" y="256.5">turn 4 resumes turn 3's</text></g></g></g><g data-cell-id="l_head"><g><rect x="40" y="310" width="1140" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="17px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="42" y="333">Where the turns before are kept, by kind of model</text></g></g></g><g data-cell-id="l1"><g transform="translate(0.5,0.5)"><rect x="40" y="346" width="300" height="110" rx="11" ry="11" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="190" y="389.5">An API model</text><text x="190" y="407.5">Anthropic, OpenAI-compatible,</text><text x="190" y="425.5">your own model server</text></g></g></g><g data-cell-id="l1a"><g transform="translate(0.5,0.5)"><rect x="370" y="346" width="390" height="110" rx="11" ry="11" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="565" y="389.5">The chat lives in KOLONİ's database.</text><text x="565" y="407.5">Each turn KOLONİ sends the</text><text x="565" y="425.5">topic's history.</text></g></g></g><g data-cell-id="l1b"><g transform="translate(0.5,0.5)"><rect x="790" y="346" width="390" height="110" rx="11" ry="11" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="985" y="380.5">KOLONİ compacts it: past Summarise a</text><text x="985" y="398.5">long context at (%) - 75 by default -</text><text x="985" y="416.5">of its window, the older part</text><text x="985" y="434.5">is summarised.</text></g></g></g><g data-cell-id="l2"><g transform="translate(0.5,0.5)"><rect x="40" y="476" width="300" height="110" rx="11" ry="11" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="190" y="510.5">Every other CLI</text><text x="190" y="528.5">Qoder, agy; any CLI not run</text><text x="190" y="546.5">Native; Claude Code or Codex</text><text x="190" y="564.5">on your own sign-in</text></g></g></g><g data-cell-id="l2a"><g transform="translate(0.5,0.5)"><rect x="370" y="476" width="390" height="110" rx="11" ry="11" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="565" y="519.5">Started anew each turn and sent</text><text x="565" y="537.5">the topic's history again:</text><text x="565" y="555.5">no session of its own goes on.</text></g></g></g><g data-cell-id="l2b"><g transform="translate(0.5,0.5)"><rect x="790" y="476" width="390" height="110" rx="11" ry="11" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="985" y="510.5">KOLONİ compacts it, as for an API</text><text x="985" y="528.5">model (the role's window, else the</text><text x="985" y="546.5">catalogue's). One run per model step:</text><text x="985" y="564.5">each step is sent a trimmed history.</text></g></g></g><g data-cell-id="l3"><g transform="translate(0.5,0.5)"><rect x="40" y="606" width="300" height="110" rx="11" ry="11" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="190" y="649.5">Claude Code or Codex, Native,</text><text x="190" y="667.5">on Sign-in: Its own for KOLONİ;</text><text x="190" y="685.5">Copilot, Native</text></g></g></g><g data-cell-id="l3a"><g transform="translate(0.5,0.5)"><rect x="370" y="606" width="390" height="110" rx="11" ry="11" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="565" y="631.5">Its session is kept in KOLONİ's folder</text><text x="565" y="649.5">(runtime/cli-homes/&lt;provider id&gt;;</text><text x="565" y="667.5">Copilot's: cli-homes/copilot-sessions);</text><text x="565" y="685.5">the topic's next turn resumes it,</text><text x="565" y="703.5">sent only what is new.</text></g></g></g><g data-cell-id="l3b"><g transform="translate(0.5,0.5)"><rect x="790" y="606" width="390" height="110" rx="11" ry="11" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="985" y="640.5">It compacts its session itself. A new</text><text x="985" y="658.5">topic - or another model, folder,</text><text x="985" y="676.5">permission level or setup - starts</text><text x="985" y="694.5">a new session (Copilot's or Codex's old one goes).</text></g></g></g><g data-cell-id="e11"><g><path d="M 340 401 L 360.82 401" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 368.32 401 L 360.82 404.75 L 360.82 397.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e12"><g><path d="M 760 401 L 780.82 401" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 788.32 401 L 780.82 404.75 L 780.82 397.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e21"><g><path d="M 340 531 L 360.82 531" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 368.32 531 L 360.82 534.75 L 360.82 527.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e22"><g><path d="M 760 531 L 780.82 531" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 788.32 531 L 780.82 534.75 L 780.82 527.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e31"><g><path d="M 340 661 L 360.82 661" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 368.32 661 L 360.82 664.75 L 360.82 657.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e32"><g><path d="M 760 661 L 780.82 661" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 788.32 661 L 780.82 664.75 L 780.82 657.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="footer"><g><rect x="40" y="740" width="1140" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#555555" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><text x="42" y="759">From: app/topics.py, app/agent/context_mixin.py, app/agent/loop_mixin.py, app/agent/native_mixin.py, app/model_native.py,</text><text x="42" y="775">app/limits.py, app/agent/summary.py, app/db/models.py (24 Nov 2026)</text></g></g></g></g></g></g></svg>