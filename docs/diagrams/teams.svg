 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="st3"><g transform="translate(0.5,0.5)"><rect x="491" y="114" width="125" height="84" rx="8.4" ry="8.4" fill="#e1d5e7" stroke="#9673a6" pointer-events="all" style="fill: light-dark(rgb(225, 213, 231), rgb(57, 47, 63)); stroke: light-dark(rgb(150, 115, 166), rgb(149, 119, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="553.5" y="144.5">Write &amp;</text><text x="553.5" y="162.5">keep up</text><text x="553.5" y="180.5">Docs writer</text></g></g></g><g data-cell-id="e9"><g><path d="M 471 156 L 481.82 156" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 489.32 156 L 481.82 159.75 L 481.82 152.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="coordA"><g transform="translate(0.5,0.5)"><rect x="56" y="216" width="568" height="60" rx="6" ry="6" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="340" y="243.5">Its coordinator steps in only beside another team;</text><text x="340" y="261.5">else the Orchestrator runs it. Default recipe: its own.</text></g></g></g><g data-cell-id="teamB"><g transform="translate(0.5,0.5)"><rect x="680" y="76" width="500" height="220" rx="4.4" ry="4.4" fill="#fcfcfc" stroke="#9673a6" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(150, 115, 166), rgb(149, 119, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="694" y="104">Another team in the same turn</text></g></g></g><g data-cell-id="stB"><g transform="translate(0.5,0.5)"><rect x="700" y="114" width="460" height="100" rx="10" ry="10" fill="#e1d5e7" stroke="#9673a6" pointer-events="all" style="fill: light-dark(rgb(225, 213, 231), rgb(57, 47, 63)); stroke: light-dark(rgb(150, 115, 166), rgb(149, 119, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="930" y="152.5">Its own stages and roles,</text><text x="930" y="170.5">its own coordinator,</text><text x="930" y="188.5">its own recipe</text></g></g></g><g data-cell-id="modes"><g transform="translate(0.5,0.5)"><rect x="700" y="224" width="460" height="56" rx="5.6" ry="5.6" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="930" y="249.5">Teams for this chat: Orchestrator</text><text x="930" y="267.5">decides / Manual / No teams</text></g></g></g><g data-cell-id="lane"><g transform="translate(0.5,0.5)"><rect x="40" y="324" width="1140" height="150" rx="3" ry="3" fill="#fcfcfc" stroke="#6c8ebf" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g></g><g data-cell-id="lanetitle"><g><rect x="640" y="330" width="524" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#333333" font-family="Helvetica" font-weight="bold" text-anchor="end" font-size="16px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><text x="1162" y="352">Between teams: a lane of its own (dotted: a member's line)</text></g></g></g><g data-cell-id="room"><g transform="translate(0.5,0.5)"><rect x="60" y="360" width="540" height="96" rx="9.6" ry="9.6" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="330" y="396.5">Room: 2 to 6 agents, one goal, one working copy.</text><text x="330" y="414.5">They share the work out; each file has one holder.</text><text x="330" y="432.5">What one posts, the others read at their next step.</text></g></g></g><g data-cell-id="disc"><g transform="translate(0.5,0.5)"><rect x="620" y="360" width="540" height="96" rx="9.6" ry="9.6" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="890" y="396.5">Discussion: an agent with discuss invites 1 to 5,</text><text x="890" y="414.5">for 1 to 20 rounds (3 by default); nobody changes</text><text x="890" y="432.5">anything; the one who opened it speaks last.</text></g></g></g><g data-cell-id="e18"><g><path d="M 280 296 L 276 360" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e19"><g><path d="M 730 296 L 619.93 308.84 Q 610 310 604.05 318.04 L 573 360" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="recipe"><g transform="translate(0.5,0.5)"><rect x="40" y="500" width="1140" height="300" rx="6" ry="6" fill="#fcfcfc" stroke="#666666" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="54" y="528">A recipe: its drawn steps (an example; the team works in one copy)</text></g></g></g><g data-cell-id="r1"><g transform="translate(0.5,0.5)"><rect x="60" y="540" width="162" height="100" rx="10" ry="10" fill="#e1d5e7" stroke="#9673a6" pointer-events="all" style="fill: light-dark(rgb(225, 213, 231), rgb(57, 47, 63)); stroke: light-dark(rgb(150, 115, 166), rgb(149, 119, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="141" y="587.5">Step</text><text x="141" y="605.5">Planner</text></g></g></g><g data-cell-id="r2"><g transform="translate(0.5,0.5)"><rect x="248" y="540" width="162" height="100" rx="10" ry="10" fill="#e1d5e7" stroke="#9673a6" pointer-events="all" style="fill: light-dark(rgb(225, 213, 231), rgb(57, 47, 63)); stroke: light-dark(rgb(150, 115, 166), rgb(149, 119, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="329" y="587.5">Step</text><text x="329" y="605.5">Coder</text></g></g></g><g data-cell-id="e23"><g><path d="M 222 590 L 238.82 590" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 246.32 590 L 238.82 593.75 L 238.82 586.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="r3"><g transform="translate(0.5,0.5)"><rect x="436" y="540" width="162" height="100" rx="10" ry="10" fill="#e1d5e7" stroke="#9673a6" pointer-events="all" style="fill: light-dark(rgb(225, 213, 231), rgb(57, 47, 63)); stroke: light-dark(rgb(150, 115, 166), rgb(149, 119, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="517" y="578.5">All at once</text><text x="517" y="596.5">Reviewer | Tester</text><text x="517" y="614.5">(all branches)</text></g></g></g><g data-cell-id="e25"><g><path d="M 410 590 L 426.82 590" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 434.32 590 L 426.82 593.75 L 426.82 586.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="r4"><g transform="translate(0.5,0.5)"><rect x="624" y="540" width="162" height="100" rx="10" ry="10" fill="#e1d5e7" stroke="#9673a6" pointer-events="all" style="fill: light-dark(rgb(225, 213, 231), rgb(57, 47, 63)); stroke: light-dark(rgb(150, 115, 166), rgb(149, 119, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="705" y="578.5">Candidates</text><text x="705" y="596.5">2 to 5, each in</text><text x="705" y="614.5">its own copy</text></g></g></g><g data-cell-id="e27"><g><path d="M 598 590 L 614.82 590" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 622.32 590 L 614.82 593.75 L 614.82 586.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="r5"><g transform="translate(0.5,0.5)"><rect x="812" y="540" width="162" height="100" rx="10" ry="10" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="893" y="587.5">End</text><text x="893" y="605.5">Ask me, then in</text></g></g></g><g data-cell-id="e29"><g><path d="M 786 590 L 802.82 590" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 810.32 590 L 802.82 593.75 L 802.82 586.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="r6"><g transform="translate(0.5,0.5)"><rect x="1000" y="540" width="162" height="100" rx="10" ry="10" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1081" y="569.5">Ready for you</text><text x="1081" y="587.5">Take in / Fix the</text><text x="1081" y="605.5">findings / Ask</text><text x="1081" y="623.5">for changes</text></g></g></g><g data-cell-id="e31"><g><path d="M 974 590 L 990.82 590" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 998.32 590 L 990.82 593.75 L 990.82 586.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e32"><g><path d="M 517 640 L 517 668 Q 517 678 507 678 L 339 678 Q 329 678 329 668 L 329 649.18" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 329 641.68 L 332.75 649.18 L 325.25 649.18 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="295" y="661" width="258" height="37" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="423" y="675.5">Loop back, at most 1 to 5 rounds,</text><text x="423" y="693.5">only if the step before found a problem</text></g></g></g><g data-cell-id="evolve"><g transform="translate(0.5,0.5)"><rect x="510" y="700" width="650" height="84" rx="8.4" ry="8.4" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="835" y="730.5">Evolve: three Coders try the job, each their own way. The project's</text><text x="835" y="748.5">Measure command scores each copy (0 to 100); the best goes on. With</text><text x="835" y="766.5">a Target and a loop it is tried again while the best is below it.</text></g></g></g><g data-cell-id="e34"><g><path d="M 640 700 L 705 640" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="footer"><g><rect x="40" y="844" width="1140" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#555555" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><text x="42" y="863">From: app/team.py, app/recipes.py, app/recipe_run.py, app/evolve.py, app/room.py, app/agent/rooms_mixin.py, app/discussion.py,</text><text x="42" y="879">app/agent/discussions_mixin.py, app/db/models.py (Team, TeamStage, Recipe, ConversationTeam) (6 Nov 2026)</text></g></g></g></g></g></g></svg>