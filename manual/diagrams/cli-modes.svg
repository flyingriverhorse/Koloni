<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1260px" height="940px" viewBox="0 0 1260 940"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="backdrop"><g><rect x="10" y="10" width="1240" height="920" fill="#ffffff" stroke="none" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/></g></g><g data-cell-id="title"><g><rect x="40" y="26" width="1180" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="24px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="42" y="56">How CLIs are driven: the modes, KOLONİ's tools and the asks</text></g></g></g><g data-cell-id="step"><g transform="translate(0.5,0.5)"><rect x="30" y="80" width="390" height="200" rx="20" ry="20" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="225" y="132.5">One run per model step</text><text x="225" y="150.5">(Claude Code, Codex)</text><text x="225" y="186.5">A new CLI process for each step, in an</text><text x="225" y="204.5">empty folder, its own tools off. KOLONİ</text><text x="225" y="222.5">sends its tool list and the chat; the CLI</text><text x="225" y="240.5">answers with text and tool calls.</text></g></g></g><g data-cell-id="session"><g transform="translate(0.5,0.5)"><rect x="435" y="80" width="390" height="200" rx="20" ry="20" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="630" y="123.5">One session per agent</text><text x="630" y="141.5">(Claude Code, Codex, Copilot, Qoder)</text><text x="630" y="177.5">One CLI process runs the agent's loop</text><text x="630" y="195.5">for the turn, its own tools off (Codex's</text><text x="630" y="213.5">patch tool stays on: KOLONİ refuses</text><text x="630" y="231.5">each patch). Its one MCP server is</text><text x="630" y="249.5">KOLONİ's tool bridge.</text></g></g></g><g data-cell-id="native"><g transform="translate(0.5,0.5)"><rect x="840" y="76" width="390" height="244" rx="24.4" ry="24.4" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1035" y="123.5">Native</text><text x="1035" y="141.5">(all five)</text><text x="1035" y="177.5">The CLI runs its own loop and tools in</text><text x="1035" y="195.5">your folder or a working copy. KOLONİ's</text><text x="1035" y="213.5">team tools (open an agent, ask you)</text><text x="1035" y="231.5">come over the tool bridge.</text><text x="1035" y="267.5">agy's default: Reads with its own tools,</text><text x="1035" y="285.5">only reading; no writes, no commands.</text></g></g></g><g data-cell-id="tools"><g transform="translate(0.5,0.5)"><rect x="30" y="340" width="390" height="90" rx="9" ry="9" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="225" y="382.5">KOLONİ's tools: the permission</text><text x="225" y="400.5">check and its cards (Ready for you)</text></g></g></g><g data-cell-id="bridge"><g transform="translate(0.5,0.5)"><rect x="435" y="340" width="390" height="90" rx="9" ry="9" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="630" y="373.5">KOLONİ's tool bridge (MCP): the CLI starts</text><text x="630" y="391.5">it over stdio; it reaches KOLONİ's tool</text><text x="630" y="409.5">server on 127.0.0.1 with a key</text></g></g></g><g data-cell-id="e7"><g><path d="M 225 280 L 225 330.82" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 225 338.32 L 221.25 330.82 L 228.75 330.82 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="161" y="302" width="130" height="19" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="225" y="316.5">KOLONİ runs them</text></g></g></g><g data-cell-id="e8"><g><path d="M 630 280 L 630 330.82" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 630 338.32 L 626.25 330.82 L 633.75 330.82 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="601" y="302" width="60" height="19" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="630" y="316.5">tool calls</text></g></g></g><g data-cell-id="e9"><g><path d="M 918 320 L 832.52 379.74" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 826.37 384.04 L 830.37 376.67 L 834.67 382.82 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="836" y="344" width="71" height="19" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="871.28" y="359.15">team tools</text></g></g></g><g data-cell-id="e10"><g><path d="M 435 385 L 429.18 385" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 421.68 385 L 429.18 381.25 L 429.18 388.75 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="asks"><g transform="translate(0.5,0.5)"><rect x="30" y="480" width="1200" height="200" rx="4" ry="4" fill="#fcfcfc" stroke="#d79b00" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="44" y="508">A native CLI asks KOLONİ before its own tools act, except where noted</text></g></g></g><g data-cell-id="k0"><g transform="translate(0.5,0.5)"><rect x="44" y="520" width="226" height="140" rx="14" ry="14" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="157" y="562">Claude Code</text><text x="157" y="579">a control protocol on</text><text x="157" y="596">stdin and stdout, with</text><text x="157" y="613">a hook callback:</text><text x="157" y="630">every tool</text></g></g></g><g data-cell-id="k1"><g transform="translate(0.5,0.5)"><rect x="282" y="520" width="226" height="140" rx="14" ry="14" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="395" y="570.5">Qoder</text><text x="395" y="587.5">the same control</text><text x="395" y="604.5">protocol: every tool</text><text x="395" y="621.5">(not yet measured)</text></g></g></g><g data-cell-id="k2"><g transform="translate(0.5,0.5)"><rect x="520" y="520" width="226" height="140" rx="14" ry="14" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="633" y="545">Codex</text><text x="633" y="562">app-server, JSON-RPC:</text><text x="633" y="579">each command and</text><text x="633" y="596">patch, but not the</text><text x="633" y="613">commands its own</text><text x="633" y="630">rules count as safe</text><text x="633" y="647">or its web search</text></g></g></g><g data-cell-id="k3"><g transform="translate(0.5,0.5)"><rect x="758" y="520" width="226" height="140" rx="14" ry="14" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="871" y="570.5">Copilot</text><text x="871" y="587.5">headless, JSON-RPC:</text><text x="871" y="604.5">each command, write</text><text x="871" y="621.5">and read</text></g></g></g><g data-cell-id="k4"><g transform="translate(0.5,0.5)"><rect x="996" y="520" width="226" height="140" rx="14" ry="14" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1109" y="545">agy</text><text x="1109" y="562">a hook file in its own</text><text x="1109" y="579">home runs KOLONİ's</text><text x="1109" y="596">hook: every tool. In</text><text x="1109" y="613">Reads (its default):</text><text x="1109" y="630">no hook, its reads</text><text x="1109" y="647">are not asked</text></g></g></g><g data-cell-id="e17"><g><path d="M 1152 320 L 1066.5 472" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 1062.82 478.54 L 1063.23 470.16 L 1069.77 473.84 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="1091" y="392" width="33" height="19" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="1106.9" y="406.68">asks</text></g></g></g><g data-cell-id="e18"><g><path d="M 129.6 480 L 129.8 470 Q 130 460 129.17 450.03 L 128.26 439.15" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 127.64 431.67 L 132 438.83 L 124.53 439.46 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="77" y="438" width="107" height="37" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="129.59" y="452.52">the same check</text><text x="129.59" y="470.52">and cards</text></g></g></g><g data-cell-id="homes"><g transform="translate(0.5,0.5)"><rect x="30" y="710" width="390" height="160" rx="16" ry="16" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="225" y="745">Sign-in</text><text x="225" y="762">Claude Code, Codex: My own (your home</text><text x="225" y="779">folder) or Its own for KOLONİ, a folder</text><text x="225" y="796">under runtime/cli-homes (CLAUDE_CONFIG_DIR,</text><text x="225" y="813">CODEX_HOME). Copilot: an empty home each</text><text x="225" y="830">run, your gh or a token. agy: a new home</text><text x="225" y="847">each run. Qoder: your own sign-in.</text></g></g></g><g data-cell-id="resume"><g transform="translate(0.5,0.5)"><rect x="435" y="710" width="390" height="160" rx="16" ry="16" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="630" y="753.5">Going on from the last turn</text><text x="630" y="770.5">Only Claude Code, Native, with Its own for</text><text x="630" y="787.5">KOLONİ, resumes its session: it is sent only</text><text x="630" y="804.5">what is new, while its home, model, setup</text><text x="630" y="821.5">and permission level stay the same. Every</text><text x="630" y="838.5">other CLI starts each turn anew.</text></g></g></g><g data-cell-id="compact"><g transform="translate(0.5,0.5)"><rect x="840" y="710" width="390" height="160" rx="16" ry="16" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1035" y="753.5">Compaction</text><text x="1035" y="770.5">A resumed Claude Code session compacts</text><text x="1035" y="787.5">itself. Other session and native leads:</text><text x="1035" y="804.5">KOLONİ compacts past Summarise a long</text><text x="1035" y="821.5">context at (%), or on Compact now. A</text><text x="1035" y="838.5">run per model step is trimmed instead.</text></g></g></g><g data-cell-id="footer"><g><rect x="40" y="884" width="1180" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#555555" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><text x="42" y="903">From: app/providers.py, app/model_cli.py, app/model_session.py, app/model_native.py, app/model_agy.py, app/agy_hook.py, app/mcp_bridge.py, app/limits.py,</text><text x="42" y="919">app/agent/native_mixin.py, app/agent/approvals_mixin.py, app/agent/context_mixin.py (7 Nov 2026)</text></g></g></g></g></g></g></svg>