<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1220px" height="880px" viewBox="0 0 1220 880"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="backdrop"><g><rect x="10" y="10" width="1200" height="860" fill="#ffffff" stroke="none" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/></g></g><g data-cell-id="title"><g><rect x="40" y="26" width="1140" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="24px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="42" y="56">Memory: from a note to an approved fact, and how agents get it</text></g></g></g><g data-cell-id="w_head"><g><rect x="40" y="76" width="250" height="24" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="17px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="42" y="99">Who writes</text></g></g></g><g data-cell-id="remember"><g transform="translate(0.5,0.5)"><rect x="40" y="106" width="250" height="110" rx="11" ry="11" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="165" y="140.5">An agent's Remember</text><text x="165" y="158.5">names the lines it read</text><text x="165" y="176.5">this turn; text that reads</text><text x="165" y="194.5">like an order is refused</text></g></g></g><g data-cell-id="auto"><g transform="translate(0.5,0.5)"><rect x="40" y="236" width="250" height="100" rx="10" ry="10" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="165" y="265.5">Automatic notes</text><text x="165" y="283.5">(off by default): a fast</text><text x="165" y="301.5">model, at most three</text><text x="165" y="319.5">after each message</text></g></g></g><g data-cell-id="you"><g transform="translate(0.5,0.5)"><rect x="40" y="356" width="250" height="90" rx="9" ry="9" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="165" y="389.5">You: + Add a fact</text><text x="165" y="407.5">(subject, and a file</text><text x="165" y="425.5">with its lines if you like)</text></g></g></g><g data-cell-id="said"><g transform="translate(0.5,0.5)"><rect x="40" y="466" width="250" height="70" rx="7" ry="7" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="165" y="498.5">Your words on a card</text><text x="165" y="516.5">when you ask for changes</text></g></g></g><g data-cell-id="note"><g transform="translate(0.5,0.5)"><rect x="350" y="120" width="260" height="90" rx="9" ry="9" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="480" y="153">Note (the journal)</text><text x="480" y="172">a newer note on the same</text><text x="480" y="191">subject replaces the older</text></g></g></g><g data-cell-id="proposal"><g transform="translate(0.5,0.5)"><rect x="350" y="260" width="260" height="110" rx="11" ry="11" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="480" y="293.5">Proposal for the core</text><text x="480" y="312.5">waits for your word:</text><text x="480" y="331.5">Approve / Edit and approve /</text><text x="480" y="350.5">Reject</text></g></g></g><g data-cell-id="fact"><g transform="translate(0.5,0.5)"><rect x="350" y="430" width="260" height="90" rx="9" ry="9" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="480" y="463">Fact (the core)</text><text x="480" y="482">at most 4 000 characters;</text><text x="480" y="501">rests on lines of a file</text></g></g></g><g data-cell-id="check"><g transform="translate(0.5,0.5)"><rect x="670" y="430" width="280" height="90" rx="9" ry="9" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="810" y="463">Checked again on every read:</text><text x="810" y="482">its lines' fingerprint against</text><text x="810" y="501">the file as it reads now</text></g></g></g><g data-cell-id="status"><g transform="translate(0.5,0.5)"><rect x="990" y="420" width="200" height="110" rx="11" ry="11" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="14px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1090" y="455.5">source unchanged since noted</text><text x="1090" y="472.5">source moved / changed:</text><text x="1090" y="489.5">check again (Look again)</text><text x="1090" y="506.5">no source</text></g></g></g><g data-cell-id="held"><g transform="translate(0.5,0.5)"><rect x="670" y="570" width="280" height="80" rx="8" ry="8" fill="#f8cecc" stroke="#b85450" pointer-events="all" style="fill: light-dark(rgb(248, 206, 204), rgb(81, 45, 43)); stroke: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="810" y="598">A fact whose source moved or</text><text x="810" y="617">changed is given to no agent</text><text x="810" y="636">until you Look again</text></g></g></g><g data-cell-id="e13"><g><path d="M 290 161 L 341.06 149.09" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 348.37 147.38 L 341.92 152.74 L 340.21 145.43 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e14"><g><path d="M 290 266 L 344.22 199.13" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 348.94 193.3 L 347.13 201.49 L 341.31 196.77 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e15"><g><path d="M 480 210 L 480 250.82" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 480 258.32 L 476.25 250.82 L 483.75 250.82 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="433" y="218" width="96" height="37" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="480" y="232.5">an agent</text><text x="480" y="250.5">puts it forward</text></g></g></g><g data-cell-id="e16"><g><path d="M 480 370 L 480 420.82" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 480 428.32 L 476.25 420.82 L 483.75 420.82 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="401" y="383" width="160" height="37" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="480" y="397.5">Approve, only while</text><text x="480" y="415.5">its source is unchanged</text></g></g></g><g data-cell-id="e17"><g><path d="M 290 401 L 343.29 450.74" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 348.77 455.86 L 340.73 453.48 L 345.85 448 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e18"><g><path d="M 290 501 L 340.82 501.85" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 348.32 501.97 L 340.76 505.6 L 340.89 498.1 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e19"><g><path d="M 610 475 L 660.82 475" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 668.32 475 L 660.82 478.75 L 660.82 471.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e20"><g><path d="M 950 475 L 980.82 475" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 988.32 475 L 980.82 478.75 L 980.82 471.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e21"><g><path d="M 810 520 L 810 560.82" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 810 568.32 L 806.25 560.82 L 813.75 560.82 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="778" y="528" width="65" height="37" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="810" y="542.5">moved or</text><text x="810" y="560.5">changed</text></g></g></g><g data-cell-id="reach"><g transform="translate(0.5,0.5)"><rect x="670" y="76" width="520" height="316" rx="6.32" ry="6.32" fill="#fcfcfc" stroke="#6c8ebf" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="684" y="104">How memory reaches an agent</text></g></g></g><g data-cell-id="told"><g transform="translate(0.5,0.5)"><rect x="690" y="114" width="480" height="76" rx="7.6" ry="7.6" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="930" y="140.5">Told: said to every agent, always</text><text x="930" y="158.5">your preferences, this project's rules</text><text x="930" y="176.5">(.koloni/rules.md)</text></g></g></g><g data-cell-id="given"><g transform="translate(0.5,0.5)"><rect x="690" y="204" width="480" height="66" rx="6.6" ry="6.6" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="930" y="234.5">Facts: given when the agent's task names</text><text x="930" y="252.5">every word of the fact's subject</text></g></g></g><g data-cell-id="recall"><g transform="translate(0.5,0.5)"><rect x="690" y="284" width="480" height="90" rx="9" ry="9" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="930" y="317.5">Notes: found only when an agent looks,</text><text x="930" y="335.5">with Recall: by words, and by meaning</text><text x="930" y="353.5">if you picked an embeddings provider</text></g></g></g><g data-cell-id="e26"><g><path d="M 610 443.5 L 620 443.25 Q 630 443 630 433 L 630 247 Q 630 237 640 237 L 680.82 237" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 688.32 237 L 680.82 240.75 L 680.82 233.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e27"><g><path d="M 610 183 L 645 183 Q 655 183 655 193 L 655 319 Q 655 329 665 329 L 680.82 329" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 688.32 329 L 680.82 332.75 L 680.82 325.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="search"><g transform="translate(0.5,0.5)"><rect x="40" y="700" width="560" height="80" rx="8" ry="8" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="320" y="728.5">Search deeper and Recall look in this project's memory,</text><text x="320" y="746.5">in earlier messages, and in linked projects' memory.</text><text x="320" y="764.5">By meaning costs one embeddings request a search.</text></g></g></g><g data-cell-id="notmemory"><g transform="translate(0.5,0.5)"><rect x="630" y="700" width="560" height="80" rx="8" ry="8" fill="#e1d5e7" stroke="#9673a6" pointer-events="all" style="fill: light-dark(rgb(225, 213, 231), rgb(57, 47, 63)); stroke: light-dark(rgb(150, 115, 166), rgb(149, 119, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="910" y="728.5">Not memory: Knowledge (expert topics roles read)</text><text x="910" y="746.5">and Project notes (a Knowledge topic filled from</text><text x="910" y="764.5">the Add to Project notes? card)</text></g></g></g><g data-cell-id="footer"><g><rect x="40" y="824" width="1140" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#555555" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><text x="42" y="843">From: app/memory.py, app/agent/memory_mixin.py, app/meaning.py (search by meaning), app/earlier.py (earlier messages),</text><text x="42" y="859">app/api/memory.py, app/knows.py, app/project_notes.py (6 Nov 2026)</text></g></g></g></g></g></g></svg>