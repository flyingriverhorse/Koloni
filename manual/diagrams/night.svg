<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1220px" height="880px" viewBox="0 0 1220 880"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="backdrop"><g><rect x="10" y="10" width="1200" height="860" fill="#ffffff" stroke="none" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/></g></g><g data-cell-id="title"><g><rect x="40" y="26" width="1140" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="24px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="42" y="56">Triggers and work while you're away: work that runs while nobody watches</text></g></g></g><g data-cell-id="tl"><g transform="translate(0.5,0.5)"><rect x="30" y="72" width="1160" height="360" rx="7.2" ry="7.2" fill="#fcfcfc" stroke="#d6b656" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="44" y="100">Triggers: only you make or change one</text></g></g></g><g data-cell-id="clock"><g transform="translate(0.5,0.5)"><rect x="46" y="110" width="250" height="84" rx="8.4" ry="8.4" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="171" y="140.5">By the clock</text><text x="171" y="158.5">every N minutes (at least 5),</text><text x="171" y="176.5">or at a time of day</text></g></g></g><g data-cell-id="files"><g transform="translate(0.5,0.5)"><rect x="46" y="206" width="250" height="84" rx="8.4" ry="8.4" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="171" y="236.5">When files change</text><text x="171" y="254.5">a path pattern; it runs</text><text x="171" y="272.5">10 s after the last change</text></g></g></g><g data-cell-id="hook"><g transform="translate(0.5,0.5)"><rect x="46" y="302" width="250" height="84" rx="8.4" ry="8.4" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="171" y="332.5">On a request from outside</text><text x="171" y="350.5">a POST from this machine;</text><text x="171" y="368.5">its body is data, not orders</text></g></g></g><g data-cell-id="turn"><g transform="translate(0.5,0.5)"><rect x="336" y="196" width="240" height="110" rx="11" ry="11" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="456" y="229.5">A turn nobody watches</text><text x="456" y="248.5">in the trigger's chat,</text><text x="456" y="267.5">with the message you</text><text x="456" y="286.5">wrote beforehand</text></g></g></g><g data-cell-id="e7"><g><path d="M 296 152 L 332.56 242.49" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 335.37 249.45 L 329.09 243.9 L 336.04 241.09 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e8"><g><path d="M 296 248 L 326.85 250.31" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 334.33 250.87 L 326.57 254.05 L 327.13 246.57 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e9"><g><path d="M 296 344 L 332.37 259.43" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 335.34 252.54 L 335.82 260.91 L 328.93 257.95 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="may"><g transform="translate(0.5,0.5)"><rect x="616" y="110" width="290" height="130" rx="13" ry="13" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="761" y="145.5">What it may do (you tick it):</text><text x="761" y="163.5">change files; ticked commands,</text><text x="761" y="181.5">exactly as written; 0 to 4</text><text x="761" y="199.5">sub-agents; search; GET to</text><text x="761" y="217.5">ticked hosts; notifications</text></g></g></g><g data-cell-id="budget"><g transform="translate(0.5,0.5)"><rect x="616" y="260" width="290" height="110" rx="11" ry="11" fill="#fff2cc" stroke="#d6b656" pointer-events="all" style="fill: light-dark(rgb(255, 242, 204), rgb(40, 29, 0)); stroke: light-dark(rgb(214, 182, 86), rgb(109, 81, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="761" y="294.5">Its budget: model steps (15),</text><text x="761" y="312.5">minutes (10), runs a day (24).</text><text x="761" y="330.5">Three failed or over-budget</text><text x="761" y="348.5">runs in a row switch it off</text></g></g></g><g data-cell-id="e12"><g><path d="M 576 229 L 610.54 182.37" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 615 176.35 L 613.55 184.61 L 607.52 180.14 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e13"><g><path d="M 576 273 L 609.67 308.35" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 614.84 313.79 L 606.96 310.94 L 612.39 305.77 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="refused"><g transform="translate(0.5,0.5)"><rect x="940" y="110" width="236" height="120" rx="12" ry="12" fill="#f8cecc" stroke="#b85450" pointer-events="all" style="fill: light-dark(rgb(248, 206, 204), rgb(81, 45, 43)); stroke: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1058" y="149.5">Anything else is refused,</text><text x="1058" y="167.5">not asked. Its record says</text><text x="1058" y="185.5">It would have asked you: ...</text><text x="1058" y="203.5">with Allow this in the trigger</text></g></g></g><g data-cell-id="never"><g transform="translate(0.5,0.5)"><rect x="940" y="246" width="236" height="130" rx="13" ry="13" fill="#f8cecc" stroke="#b85450" pointer-events="all" style="fill: light-dark(rgb(248, 206, 204), rgb(81, 45, 43)); stroke: light-dark(rgb(184, 84, 80), rgb(215, 129, 126));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1058" y="281.5">Never: secret files, files</text><text x="1058" y="299.5">that steer later turns, outside</text><text x="1058" y="317.5">the project, MCP tools, a move</text><text x="1058" y="335.5">to a paid provider, a CLI with</text><text x="1058" y="353.5">its own tools, the memory core</text></g></g></g><g data-cell-id="e16"><g><path d="M 906 175 L 930.92 171.34" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 938.34 170.24 L 931.47 175.05 L 930.38 167.63 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="nl"><g transform="translate(0.5,0.5)"><rect x="30" y="456" width="1160" height="360" rx="7.2" ry="7.2" fill="#fcfcfc" stroke="#6c8ebf" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="44" y="484">Work while you're away: the Orchestrator's jobs, for an hour or the night</text></g></g></g><g data-cell-id="plan"><g transform="translate(0.5,0.5)"><rect x="46" y="500" width="220" height="110" rx="11" ry="11" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="156" y="534.5">Only the Orchestrator</text><text x="156" y="552.5">plans the jobs, in a</text><text x="156" y="570.5">turn you started;</text><text x="156" y="588.5">it does no job itself</text></g></g></g><g data-cell-id="card"><g transform="translate(0.5,0.5)"><rect x="296" y="492" width="300" height="126" rx="12.6" ry="12.6" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="446" y="525.5">While you're away card</text><text x="446" y="543.5">Start / Change the list / Not now.</text><text x="446" y="561.5">Up to 10 jobs; what is kept out;</text><text x="446" y="579.5">stops at the limit or time you set,</text><text x="446" y="597.5">if any (and within your budget)</text></g></g></g><g data-cell-id="jobs"><g transform="translate(0.5,0.5)"><rect x="626" y="492" width="260" height="126" rx="12.6" ry="12.6" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="756" y="534.5">Jobs, one at a time</text><text x="756" y="552.5">each in a new chat and its</text><text x="756" y="570.5">own copy; ends when stuck;</text><text x="756" y="588.5">a failure tried again</text></g></g></g><g data-cell-id="morning"><g transform="translate(0.5,0.5)"><rect x="916" y="492" width="260" height="126" rx="12.6" ry="12.6" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1046" y="534.5">When you're back: the report</text><text x="1046" y="552.5">Done, Waits for your word,</text><text x="1046" y="570.5">Could not be done, Stopped,</text><text x="1046" y="588.5">Not started, Kept out</text></g></g></g><g data-cell-id="e22"><g><path d="M 266 555 L 286.82 555" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 294.32 555 L 286.82 558.75 L 286.82 551.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e23"><g><path d="M 596 555 L 616.82 555" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 624.32 555 L 616.82 558.75 L 616.82 551.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="595" y="547" width="34" height="19" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="611" y="561.5">Start</text></g></g></g><g data-cell-id="e24"><g><path d="M 886 555 L 906.82 555" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 914.32 555 L 906.82 558.75 L 906.82 551.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="copy"><g transform="translate(0.5,0.5)"><rect x="296" y="650" width="300" height="110" rx="11" ry="11" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="446" y="684.5">Your project does not change</text><text x="446" y="702.5">meanwhile: the work waits in the</text><text x="446" y="720.5">copies, a job that needs your</text><text x="446" y="738.5">word waits and the next goes on</text></g></g></g><g data-cell-id="strict"><g transform="translate(0.5,0.5)"><rect x="626" y="646" width="260" height="130" rx="13" ry="13" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="756" y="681.5">Stricter rules: a delete, an</text><text x="756" y="699.5">overwrite, sending off the</text><text x="756" y="717.5">machine or a shell command</text><text x="756" y="735.5">waits; kept out is refused;</text><text x="756" y="753.5">no MCP tools</text></g></g></g><g data-cell-id="take"><g transform="translate(0.5,0.5)"><rect x="916" y="650" width="260" height="110" rx="11" ry="11" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1046" y="684.5">Take in, Take in all;</text><text x="1046" y="702.5">Allow and go on, Refuse;</text><text x="1046" y="720.5">Try again (as an ordinary</text><text x="1046" y="738.5">turn); See the changes</text></g></g></g><g data-cell-id="e28"><g><path d="M 756 618 L 756 646" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e29"><g><path d="M 1046 618 L 1046 640.82" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 1046 648.32 L 1042.25 640.82 L 1049.75 640.82 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e30"><g><path d="M 446 618 L 446 650" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="footer"><g><rect x="40" y="824" width="1140" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#555555" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><text x="42" y="843">From: app/triggers.py, app/agent/limits_mixin.py (_nobody_to_ask), app/api/triggers.py, app/away.py (unattended,</text><text x="42" y="859">TRIES), app/agent/away_mixin.py (_night_asks, _keeps_out), app/backlog.py, app/copies.py (6 Nov 2026)</text></g></g></g></g></g></g></svg>