<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent; background-color: transparent;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1220px" height="496px" viewBox="0 0 1220 496"><defs/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="backdrop"><g><rect x="10" y="10" width="1200" height="476" fill="#ffffff" stroke="none" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/></g></g><g data-cell-id="title"><g><rect x="40" y="26" width="1140" height="36" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="24px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="42" y="56">Work while you're away: work that runs while nobody watches</text></g></g></g><g transform="translate(0,-384)"><g data-cell-id="nl"><g transform="translate(0.5,0.5)"><rect x="30" y="456" width="1160" height="360" rx="7.2" ry="7.2" fill="#fcfcfc" stroke="#6c8ebf" stroke-dasharray="3 3" pointer-events="all" style="fill: light-dark(rgb(252, 252, 252), rgb(20, 20, 20)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" font-weight="bold" text-anchor="start" font-size="16px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="44" y="484">☾ Away: your To-do tasks, worked through until you are back</text></g></g></g><g data-cell-id="plan"><g transform="translate(0.5,0.5)"><rect x="46" y="500" width="220" height="110" rx="11" ry="11" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="156" y="534.5">☾ Away on a chat's line,</text><text x="156" y="552.5">or the Orchestrator's</text><text x="156" y="570.5">Go away line; it does</text><text x="156" y="588.5">none of the work itself</text></g></g></g><g data-cell-id="card"><g transform="translate(0.5,0.5)"><rect x="296" y="492" width="300" height="126" rx="12.6" ry="12.6" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="446" y="525.5">The Away panel</text><text x="446" y="543.5">Go away / Change / Cancel.</text><text x="446" y="561.5">Up to 10 To-do tasks; kept out;</text><text x="446" y="579.5">stops at the limit or time you set,</text><text x="446" y="597.5">if any (and within your budget)</text></g></g></g><g data-cell-id="jobs"><g transform="translate(0.5,0.5)"><rect x="626" y="492" width="260" height="126" rx="12.6" ry="12.6" fill="#dae8fc" stroke="#6c8ebf" pointer-events="all" style="fill: light-dark(rgb(218, 232, 252), rgb(29, 41, 59)); stroke: light-dark(rgb(108, 142, 191), rgb(92, 121, 163));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="756" y="516.5">Jobs, one at a time</text><text x="756" y="534.5">each in a new chat, in a copy -</text><text x="756" y="552.5">a git repository: on its own</text><text x="756" y="570.5">koloni/ branch, committed;</text><text x="756" y="588.5">ends when stuck; a failure</text><text x="756" y="606.5">tried again</text></g></g></g><g data-cell-id="morning"><g transform="translate(0.5,0.5)"><rect x="916" y="492" width="260" height="126" rx="12.6" ry="12.6" fill="#d5e8d4" stroke="#82b366" pointer-events="all" style="fill: light-dark(rgb(213, 232, 212), rgb(31, 47, 30)); stroke: light-dark(rgb(130, 179, 102), rgb(68, 110, 44));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1046" y="534.5">When you're back: the report</text><text x="1046" y="552.5">Waiting for you, Done, Waits</text><text x="1046" y="570.5">for your word, Could not be</text><text x="1046" y="588.5">done, Stopped, Kept out</text></g></g></g><g data-cell-id="e22"><g><path d="M 266 555 L 286.82 555" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 294.32 555 L 286.82 558.75 L 286.82 551.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e23"><g><path d="M 596 555 L 616.82 555" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 624.32 555 L 616.82 558.75 L 616.82 551.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g><g><g fill="#333333" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(51, 51, 51), rgb(193, 193, 193));"><rect fill="#ffffff" stroke="none" x="581" y="547" width="61" height="19" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="611" y="561.5">Go away</text></g></g></g><g data-cell-id="e24"><g><path d="M 886 555 L 906.82 555" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 914.32 555 L 906.82 558.75 L 906.82 551.25 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="copy"><g transform="translate(0.5,0.5)"><rect x="296" y="650" width="300" height="110" rx="11" ry="11" fill="#ffffff" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="446" y="684.5">Your project does not change</text><text x="446" y="702.5">meanwhile: the work waits in its</text><text x="446" y="720.5">copy or branch; a card or a</text><text x="446" y="738.5">question for you is parked</text></g></g></g><g data-cell-id="strict"><g transform="translate(0.5,0.5)"><rect x="626" y="646" width="260" height="130" rx="13" ry="13" fill="#f5f5f5" stroke="#666666" pointer-events="all" style="fill: light-dark(rgb(245, 245, 245), rgb(26, 26, 26)); stroke: light-dark(rgb(102, 102, 102), rgb(149, 149, 149));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="756" y="672.5">Stricter rules: a delete, an</text><text x="756" y="690.5">overwrite, sending off the</text><text x="756" y="708.5">machine or a shell command</text><text x="756" y="726.5">is parked (a one-line delete</text><text x="756" y="744.5">your words allow may run);</text><text x="756" y="762.5">kept out refused; no MCP tools</text></g></g></g><g data-cell-id="take"><g transform="translate(0.5,0.5)"><rect x="916" y="650" width="260" height="110" rx="11" ry="11" fill="#ffe6cc" stroke="#d79b00" pointer-events="all" style="fill: light-dark(rgb(255, 230, 204), rgb(54, 33, 10)); stroke: light-dark(rgb(215, 155, 0), rgb(153, 101, 0));"/></g><g><g fill="#1a1a1a" font-family="Helvetica" text-anchor="middle" font-size="15px" style="fill: light-dark(rgb(26, 26, 26), rgb(215, 215, 215));"><text x="1046" y="684.5">Run, Reject, Answer: then the</text><text x="1046" y="702.5">same agent goes on; a branch's</text><text x="1046" y="720.5">push waits for your Run; Take</text><text x="1046" y="738.5">in, Take in all; Try again</text></g></g></g><g data-cell-id="e28"><g><path d="M 756 618 L 756 646" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e29"><g><path d="M 1046 618 L 1046 640.82" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/><path d="M 1046 648.32 L 1042.25 640.82 L 1049.75 640.82 Z" fill="#555555" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164)); stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="e30"><g><path d="M 446 618 L 446 650" fill="none" stroke="#555555" stroke-width="1.5" stroke-miterlimit="10" stroke-dasharray="4.5 4.5" pointer-events="stroke" style="stroke: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"/></g></g><g data-cell-id="footer"><g><rect x="40" y="824" width="1140" height="40" fill="none" stroke="none" pointer-events="all"/></g><g><g fill="#555555" font-family="Helvetica" text-anchor="start" font-size="13px" style="fill: light-dark(rgb(85, 85, 85), rgb(164, 164, 164));"><text x="42" y="843">From: app/clock.py (the clock), app/away.py (unattended,</text><text x="42" y="859">TRIES), app/agent/away_mixin.py (_night_asks, _parker), app/parked.py, app/backlog.py, app/away_branch.py (26 Nov 2026)</text></g></g></g></g></g></g></g></svg>