[build-system]
requires = ["hatchling>=1.28,<2"]
build-backend = "hatchling.build"

[project]
name = "koloni-agent"
version = "0.1.10"
description = "Local-first agent workspace"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.141,<0.142",
  "pydantic>=2.13,<3",
  "uvicorn[standard]>=0.53,<0.54",
  "httpx>=0.28,<0.29",
  "httpx2>=2,<3",
  "starlette>=1.6,<2",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.16,<2",
  # A PDF's text, for one attached to a chat (slice 85b): BSD-3-Clause, pinned.
  "pypdf==6.21.4",
  # The project's CI workflows, read for the end check's commands (kanıtlı bitiş S8): MIT.
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
  "anyio>=4,<4.15",
  "pytest>=9.1,<10",
  "pytest-xdist>=3.6,<4",
  "ruff>=0.16,<0.17",
  "ty>=0.0.80,<0.1",
]
# CI's lint part beside ruff and ty: dead code, and a second type checker (pyrefly.toml). MIT both.
# The maintainers' and CI's own, never in an install: requirements-lint.lock, not the dev lock.
lint = [
  "vulture>=2.16,<3",
  "pyrefly>=1.5,<1.6",
]
# The user guide (docs): `zensical build` (zensical.toml).
docs = [
  "zensical==0.1.3",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a running local model; excluded from verify",
           "no_po: counts model calls the Assistant PO's own request would add to",
           "judge: Full auto's judge is asked (off in every other test: tests/conftest.py)"]
addopts = "-m 'not live' -p no:cacheprovider"

[tool.vulture]
# CI lint: `python -m vulture` - code nothing calls, where it is 80% sure or more (below, mostly
# FastAPI routes and pydantic fields it cannot see used).
paths = ["app", "scripts"]
min_confidence = 80
# SQLAlchemy calls `TypeDecorator.process_result_value` with it (`app.db.models`); ty and Pyrefly
# hold an override to the parameter's name.
ignore_names = ["dialect"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C901"]

# Each `# noqa: C901` is debt from before this rule: the list shrinks as functions are split; never add one.
[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"app/api/*.py" = ["B008"]
"alembic/versions/*.py" = ["E501"]
"tests/*.py" = ["E501", "F811"]  # (F811: a fixture imported, then a test's parameter)
