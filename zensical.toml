[project.theme]
# The system's own fonts: no page asks Google Fonts (docs/security/privacy.md lists none).
font = false
# KOLONİ's own logo (frontend/public/favicon.svg), in the header and as the tab icon.
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.top",
  "search.highlight",
]

# Light and dark, following the system until the toggle picks one. The colours are KOLONİ's own:
# docs/stylesheets/koloni.css.
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle = { icon = "lucide/moon", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle = { icon = "lucide/sun", name = "Switch to light mode" }

# Listed in full: a list here replaces the defaults, and the pages need tables, notes and tabs.
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
