# Labels each pull request by the paths it changes (.github/labeler.yml). On pull_request, not
# pull_request_target: a pull request from a fork gets a read-only token and is not labelled, but no
# fork's code ever runs with write access.
name: PR labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  label:
    name: Label by path
    # A fork's pull request gets a read-only token: skip it rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
