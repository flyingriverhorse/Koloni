# CodeQL code scanning, Python and JavaScript/TypeScript, source only (build-mode: none: no
# install, no build). On a private repository it needs GitHub Code Security, so it runs nothing
# until the repository variable CODE_SECURITY is 'true' (see .github/CI.md); skipped jobs use no
# minutes. Results: Security -> Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
    paths:
      # pr-check.yml's skip list: the guide and notes are not code.
      - '**'
      - '!docs/**'
      - '!README.md'
      - '!SECURITY.md'
      - '!CHANGELOG.md'
      - '!THIRD-PARTY-NOTICES.md'
      - '!.github/CI.md'
      - '!.github/SUPPORT.md'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/pull_request_template.md'
  pull_request:
    branches: [main]
    paths:
      - '**'
      - '!docs/**'
      - '!README.md'
      - '!SECURITY.md'
      - '!CHANGELOG.md'
      - '!THIRD-PARTY-NOTICES.md'
      - '!.github/CI.md'
      - '!.github/SUPPORT.md'
      - '!.github/ISSUE_TEMPLATE/**'
      - '!.github/pull_request_template.md'
  schedule:
    - cron: '0 7 * * 1'  # Mondays 07:00 UTC: new CodeQL queries can find things in unchanged code
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Per event too: the weekly run and a push to main do not cancel each other.
  group: codeql-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    if: vars.CODE_SECURITY == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write  # upload the results
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql-config.yml
      - uses: github/codeql-action/analyze@v4.38.2
        with:
          category: /language:${{ matrix.language }}
